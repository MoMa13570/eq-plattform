name: Build firmware release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-latest
    env:
      PLATFORMIO_CORE_DIR: ${{ runner.temp }}/platformio
    defaults:
      run:
        working-directory: software/EQ-Plattform_TMC2209

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install PlatformIO
        run: python -m pip install platformio

      - name: Build Uno and ESP32 firmware
        run: pio run -e uno -e esp32

      - name: Assemble release files
        run: |
          mkdir -p ../../dist
          cp .pio/build/uno/firmware.hex ../../dist/EQ-Plattform-UNO-NANO.hex
          python "$PLATFORMIO_CORE_DIR/packages/tool-esptoolpy/esptool.py" \
            --chip esp32 merge_bin \
            --output ../../dist/EQ-Plattform-ESP32.factory.bin \
            --flash_mode dio --flash_freq 40m --flash_size 4MB \
            0x1000 .pio/build/esp32/bootloader.bin \
            0x8000 .pio/build/esp32/partitions.bin \
            0xe000 "$PLATFORMIO_CORE_DIR/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin" \
            0x10000 .pio/build/esp32/firmware.bin
          cd ../../dist
          sha256sum EQ-Plattform-UNO-NANO.hex EQ-Plattform-ESP32.factory.bin > SHA256SUMS.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eq-platform-firmware
          path: dist/

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
