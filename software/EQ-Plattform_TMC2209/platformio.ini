; =============================================================
; PlatformIO configuration – EQ-Plattform TMC2209
; =============================================================
; Environments:
;  - nano        : Main firmware on Arduino Nano
;  - uno         : Main firmware on Arduino UNO
;  - uno_test    : Breadboard / motor / switch test on Arduino UNO
; =============================================================

[platformio]
default_envs = uno

; -------------------------------------------------------------
; Common library dependencies (shared by main firmware)
; -------------------------------------------------------------
[common]
lib_deps =
  durydevelop/OLED SSD1306 - SH1106@^1.0.7
  olikraus/U8g2@^2.36.12
  teemuatlut/TMCStepper@^0.7.3

; -------------------------------------------------------------
; Arduino Nano – main EQ firmware
; -------------------------------------------------------------
[env:nano]
platform = atmelavr
board = nanoatmega328
framework = arduino

lib_deps =
  ${common.lib_deps}

; -------------------------------------------------------------
; Arduino UNO – main EQ firmware
; -------------------------------------------------------------
[env:uno]
platform = atmelavr
board = uno
framework = arduino

; CH340 UNO clones often upload reliably with an explicit baud rate
upload_speed = 115200

; Let PlatformIO auto-detect the upload port (more robust on macOS)
; upload_port = /dev/cu.usbmodemXXXX

; If uploads ever fail on clones, try one of these:
; upload_speed = 115200
; upload_speed = 57600

lib_deps =
  ${common.lib_deps}

; -------------------------------------------------------------
; Arduino UNO – breadboard / hardware test firmware
; -------------------------------------------------------------
[env:uno_test]
platform = atmelavr
board = uno
framework = arduino

; Build ONLY test.cpp (no OLED, no EQ logic)
build_src_filter =
  +<test.cpp>
  -<main.cpp>

lib_deps =
  teemuatlut/TMCStepper@^0.7.3

build_flags =
  -DTMC2209_BREADBOARD_TEST

; -------------------------------------------------------------
; Arduino UNO (CH340) – alternate upload speed (older bootloader)
; -------------------------------------------------------------
[env:uno_57600]
platform = atmelavr
board = uno
framework = arduino
upload_speed = 57600

lib_deps =
  ${common.lib_deps}
